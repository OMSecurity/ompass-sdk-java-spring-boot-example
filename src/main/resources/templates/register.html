<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{register.title}">회원가입 - DemoMail</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- i18n data for JavaScript -->
<div id="i18n-data" style="display:none"
     th:data-username-required="#{register.error.username.required}"
     th:data-username-length="#{register.error.username.length}"
     th:data-username-format="#{register.error.username.format}"
     th:data-email-required="#{register.error.email.required}"
     th:data-email-format="#{register.error.email.format}"
     th:data-name-required="#{register.error.name.required}"
     th:data-name-length="#{register.error.name.length}"
     th:data-password-required="#{register.error.password.required}"
     th:data-password-length="#{register.error.password.length}"
     th:data-password-confirm-required="#{register.error.password.confirm.required}"
     th:data-password-confirm-mismatch="#{register.error.password.confirm.mismatch}"
     th:data-terms-required="#{register.error.terms.required}">
</div>

<!-- DEMO Banner -->
<div class="top-bar">
    <div class="top-bar-inner">
        <span class="demo-badge">DEMO</span>
        <span th:text="#{common.demo.banner}">OMPASS SDK 연동 예제입니다. 실제 서비스가 아닙니다.</span>
    </div>
</div>

<!-- Header -->
<header class="site-header">
    <div class="header-inner">
        <a href="/" class="logo">
            <span class="logo-text">DemoMail</span>
        </a>
        <nav class="header-nav">
            <a href="/login" class="link" th:text="#{common.login}">로그인</a>
        </nav>
        <div class="lang-switcher">
            <a href="?lang=ko">한국어</a>
            <a href="?lang=en">EN</a>
            <a href="?lang=ja">日本語</a>
        </div>
    </div>
</header>

<!-- Main Content -->
<main class="main-content">
    <div class="container">

        <div class="login-content-box" style="max-width: 480px; margin: 0 auto;">

            <!-- Flash Messages -->
            <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

            <div class="form-header-row" style="text-align: center;">
                <span class="logo-text" style="font-size: 28px;">DemoMail</span>
                <h2 style="margin-top: 16px;" th:text="#{register.heading}">회원가입</h2>
                <p class="form-desc" th:text="#{register.desc}">계정을 만들어 서비스를 시작하세요.</p>
            </div>

            <form id="register-form" th:action="@{/register}" method="post" class="login-form active" novalidate>

                <div class="form-group">
                    <label for="username"><span th:text="#{register.username.label}">아이디</span> <span class="required">*</span></label>
                    <input type="text" id="username" name="username" th:placeholder="#{register.username.placeholder}" placeholder="영문/숫자 4~15자" autocomplete="username" required>
                    <span class="field-error" id="username-error"></span>
                </div>

                <div class="form-group">
                    <label for="email"><span th:text="#{register.email.label}">이메일</span> <span class="required">*</span></label>
                    <input type="email" id="email" name="email" th:placeholder="#{register.email.placeholder}" placeholder="example@email.com" autocomplete="email" required>
                    <span class="field-error" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label for="name"><span th:text="#{register.name.label}">이름</span> <span class="required">*</span></label>
                    <input type="text" id="name" name="name" th:placeholder="#{register.name.placeholder}" placeholder="이름을 입력하세요" autocomplete="name" required>
                    <span class="field-error" id="name-error"></span>
                </div>

                <div class="form-group">
                    <label for="password"><span th:text="#{register.password.label}">비밀번호</span> <span class="required">*</span></label>
                    <input type="password" id="password" name="password" th:placeholder="#{register.password.placeholder}" placeholder="8자 이상" autocomplete="new-password" required>
                    <p class="form-desc" style="margin-top: 4px; font-size: 12px;" th:text="#{register.password.hint}">영문, 숫자를 포함하여 8자 이상 입력하세요.</p>
                    <span class="field-error" id="password-error"></span>
                </div>

                <div class="form-group">
                    <label for="password-confirm"><span th:text="#{register.password.confirm.label}">비밀번호 확인</span> <span class="required">*</span></label>
                    <input type="password" id="password-confirm" name="passwordConfirm" th:placeholder="#{register.password.confirm.placeholder}" placeholder="비밀번호를 다시 입력하세요" autocomplete="new-password" required>
                    <span class="field-error" id="password-confirm-error"></span>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" name="terms" required>
                        <span><span th:text="#{register.terms}">이용약관 및 개인정보처리방침에 동의합니다.</span> <span class="required">*</span></span>
                    </label>
                    <span class="field-error" id="terms-error"></span>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-block" th:text="#{register.submit}">회원가입</button>
                </div>

                <div class="form-links">
                    <span th:text="#{register.has.account}">이미 계정이 있으신가요?</span>
                    <a href="/login" class="link" th:text="#{common.login}">로그인</a>
                </div>

            </form>
        </div>

    </div>
</main>

<!-- Footer -->
<footer class="site-footer">
    <div class="footer-inner">
        <p style="font-size: 12px; color: #80868b; text-align: center;">DemoMail - OMPASS SDK Example | &copy; 2025</p>
    </div>
</footer>

<!-- Flash message handling -->
<script th:inline="javascript">
    const flashMessage = /*[[${message}]]*/ null;
    const flashError = /*[[${error}]]*/ null;
</script>

<script>
    const i18n = document.getElementById('i18n-data').dataset;

    // Validation rules
    function validateUsername(value) {
        if (!value) return i18n.usernameRequired;
        if (value.length < 4 || value.length > 15) return i18n.usernameLength;
        if (!/^[a-zA-Z0-9]+$/.test(value)) return i18n.usernameFormat;
        return '';
    }

    function validateEmail(value) {
        if (!value) return i18n.emailRequired;
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) return i18n.emailFormat;
        return '';
    }

    function validateName(value) {
        if (!value) return i18n.nameRequired;
        if (value.length < 1 || value.length > 50) return i18n.nameLength;
        return '';
    }

    function validatePassword(value) {
        if (!value) return i18n.passwordRequired;
        if (value.length < 8) return i18n.passwordLength;
        return '';
    }

    function validatePasswordConfirm(value) {
        const password = document.getElementById('password').value;
        if (!value) return i18n.passwordConfirmRequired;
        if (value !== password) return i18n.passwordConfirmMismatch;
        return '';
    }

    // Show error for a field
    function showFieldError(fieldId, errorMsg) {
        const errorEl = document.getElementById(fieldId + '-error');
        const inputEl = document.getElementById(fieldId);
        if (errorMsg) {
            errorEl.textContent = errorMsg;
            errorEl.style.display = 'block';
            inputEl.classList.add('input-error');
        } else {
            errorEl.textContent = '';
            errorEl.style.display = 'none';
            inputEl.classList.remove('input-error');
        }
    }

    // Blur validation events
    document.getElementById('username').addEventListener('blur', function() {
        showFieldError('username', validateUsername(this.value.trim()));
    });

    document.getElementById('email').addEventListener('blur', function() {
        showFieldError('email', validateEmail(this.value.trim()));
    });

    document.getElementById('name').addEventListener('blur', function() {
        showFieldError('name', validateName(this.value.trim()));
    });

    document.getElementById('password').addEventListener('blur', function() {
        showFieldError('password', validatePassword(this.value));
    });

    document.getElementById('password-confirm').addEventListener('blur', function() {
        showFieldError('password-confirm', validatePasswordConfirm(this.value));
    });

    // Form submission validation
    document.getElementById('register-form').addEventListener('submit', function(e) {
        let hasError = false;

        const usernameErr = validateUsername(document.getElementById('username').value.trim());
        const emailErr = validateEmail(document.getElementById('email').value.trim());
        const nameErr = validateName(document.getElementById('name').value.trim());
        const passwordErr = validatePassword(document.getElementById('password').value);
        const passwordConfirmErr = validatePasswordConfirm(document.getElementById('password-confirm').value);

        showFieldError('username', usernameErr);
        showFieldError('email', emailErr);
        showFieldError('name', nameErr);
        showFieldError('password', passwordErr);
        showFieldError('password-confirm', passwordConfirmErr);

        if (usernameErr || emailErr || nameErr || passwordErr || passwordConfirmErr) {
            hasError = true;
        }

        // Terms checkbox
        const termsEl = document.getElementById('terms');
        const termsErrorEl = document.getElementById('terms-error');
        if (!termsEl.checked) {
            termsErrorEl.textContent = i18n.termsRequired;
            termsErrorEl.style.display = 'block';
            hasError = true;
        } else {
            termsErrorEl.textContent = '';
            termsErrorEl.style.display = 'none';
        }

        if (hasError) {
            e.preventDefault();
        }
    });
</script>

</body>
</html>
